<app-modal [open]="open()" [title]="isEdit() ? 'تعديل عملة' : 'عملة جديدة'" size="md" (closed)="closed.emit()">
  <form id="currency-form" class="cf" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!-- Live preview -->
    <div class="cf__preview">
      <span class="cf__symbol">{{ preview().symbol || preview().code || '¤' }}</span>
      <div>
        <strong>{{ preview().name || 'اسم العملة' }}</strong>
        <small class="ltr">1 {{ preview().code || '???' }} = {{ preview().rate || 0 }} {{ base }}</small>
      </div>
      @if (rateChange(); as pct) {
      <span class="cf__delta ltr" [class.is-up]="pct > 0" [class.is-down]="pct < 0">{{ delta(pct) }}</span>
      }
    </div>

    <div class="cf__grid">
      <label class="ui-field">
        <span class="ui-label is-required">رمز العملة (ISO)</span>
        <input class="ui-input ltr" formControlName="code" maxlength="3" placeholder="USD" autocomplete="off"
          (input)="onCodeInput($any($event.target))" />
        @if (codeTaken()) {
        <div class="cf__err">العملة {{ preview().code }} مضافة بالفعل</div>
        } @else if (form.controls.code.touched && form.controls.code.hasError('pattern')) {
        <div class="cf__err">3 حروف لاتينية كبيرة (مثل USD)</div>
        } @else {
        <app-form-error [control]="form.controls.code" label="رمز العملة" />
        }
      </label>

      <label class="ui-field">
        <span class="ui-label">الرمز المختصر</span>
        <input class="ui-input" formControlName="symbol" placeholder="$" />
        <span class="ui-hint">يُستخدم رمز ISO إذا تُرك فارغًا.</span>
      </label>

      <label class="ui-field cf__span">
        <span class="ui-label is-required">اسم العملة</span>
        <input class="ui-input" formControlName="name" placeholder="مثال: دولار أمريكي" />
        <app-form-error [control]="form.controls.name" label="اسم العملة" />
      </label>

      <label class="ui-field cf__span">
        <span class="ui-label is-required">سعر الصرف</span>
        <div class="ui-affix">
          <input class="ui-input ltr" type="number" step="0.0001" min="0" formControlName="rate" />
          <span class="ui-affix__text">{{ base }}</span>
        </div>
        @if (form.controls.rate.touched && form.controls.rate.invalid) {
        <div class="cf__err">سعر الصرف يجب أن يكون أكبر من صفر</div>
        } @else {
        <span class="ui-hint">عدد الجنيهات المصرية مقابل وحدة واحدة من العملة.</span>
        }
      </label>
    </div>

    <label class="ui-switch">
      <input type="checkbox" formControlName="isActive" />
      <span class="ui-switch__track"></span>
      {{ form.controls.isActive.value ? 'نشطة وتظهر في المستندات' : 'موقوفة' }}
    </label>
  </form>

  <div modal-footer class="cf__footer">
    <button type="button" class="ui-btn ui-btn--ghost" (click)="closed.emit()">إلغاء</button>
    <button type="submit" form="currency-form" class="ui-btn ui-btn--primary" [class.is-loading]="saving()"
      [disabled]="saving()">
      <app-icon name="check" [size]="16" /> {{ isEdit() ? 'حفظ التعديلات' : 'إضافة العملة' }}
    </button>
  </div>
</app-modal>
