<header class="tb">
  <!-- Mobile: open the sidebar drawer -->
  <button type="button" class="tb__icon-btn tb__burger" (click)="layout.toggleMobile()"
    [attr.aria-label]="layout.mobileOpen() ? 'إغلاق القائمة' : 'فتح القائمة'" [attr.aria-expanded]="layout.mobileOpen()">
    <span class="tb__burger-lines" [class.is-open]="layout.mobileOpen()"><i></i><i></i><i></i></span>
  </button>

  <a class="tb__brand" routerLink="/dashboard" aria-label="الذهاب إلى لوحة التحكم">
    <app-brand-logo [height]="46" />
  </a>

  <div class="tb__search">
    <app-nav-search />
  </div>

  <div class="tb__actions">
    <app-theme-toggle />
    <span class="tb__divider" aria-hidden="true"></span>
    <app-user-menu (signOut)="logout()" />
  </div>

  <!-- Brand accent line -->
  <span class="tb__accent" aria-hidden="true"></span>
</header>
