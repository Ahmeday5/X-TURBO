<nav class="sb" [class.is-collapsed]="layout.collapsed()" [class.is-open]="layout.mobileOpen()"
  aria-label="القائمة الرئيسية">
  <div class="sb__scroll">
    @for (section of sections(); track section.label) {
    <div class="sb__section">
      <div class="sb__label"><span>{{ section.label }}</span></div>

      @for (item of section.items; track item.id) {
      <a class="sb__item" [routerLink]="item.route" routerLinkActive="is-active" #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null" [attr.title]="layout.collapsed() ? item.label : null"
        [style.--i]="item.order" (click)="layout.closeMobile()">
        <span class="sb__icon"><app-icon [name]="item.icon" [size]="18" /></span>
        <span class="sb__text">{{ item.label }}</span>
      </a>
      }
    </div>
    }
  </div>

  <footer class="sb__foot">
    <button type="button" class="sb__collapse" (click)="layout.toggleCollapsed()"
      [attr.aria-label]="layout.collapsed() ? 'توسيع القائمة' : 'طي القائمة'"
      [attr.aria-expanded]="!layout.collapsed()">
      <span class="sb__icon"><app-icon class="sb__chev" name="chevron-left" [size]="16" /></span>
      <span class="sb__text">طي القائمة</span>
    </button>
    <span class="sb__version sb__text ltr">v{{ appVersion }}</span>
  </footer>
</nav>
