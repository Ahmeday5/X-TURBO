<div
  class="ss"
  [class.ss--open]="open()"
  [class.ss--disabled]="disabled()"
>
  <!-- closed control -->
  <button
    type="button"
    class="ui-input ss__control"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [class.is-invalid]="isInvalid()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    @if (selectedOption(); as sel) {
      <span class="ss__value">
        {{ sel.label }}
        @if (sel.hint) {
          <span class="ss__hint">— {{ sel.hint }}</span>
        }
      </span>
      <span
        class="ss__clear"
        role="button"
        aria-label="مسح الاختيار"
        (click)="clear($event)"
      >&times;</span>
    } @else {
      <span class="ss__placeholder">{{ placeholder() }}</span>
    }
    <svg class="ss__chevron" width="12" height="12" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- dropdown panel -->
  @if (open()) {
    <div class="ss__panel">
      <input
        #searchBox
        type="text"
        class="ui-input ss__search"
        [placeholder]="searchPlaceholder()"
        [value]="term()"
        (input)="onSearch($event)"
        (keydown)="onKeydown($event)"
        autocomplete="off"
      />

      <ul class="ss__list">
        @for (opt of filtered(); track opt.value; let i = $index) {
          <li
            class="ss__option"
            [class.ss__option--active]="i === activeIndex()"
            [class.ss__option--selected]="
              selectedOption()?.value === opt.value
            "
            (click)="select(opt)"
            (mouseenter)="activeIndex.set(i)"
          >
            <span class="ss__option-label">{{ opt.label }}</span>
            @if (opt.hint) {
              <span class="ss__option-hint">{{ opt.hint }}</span>
            }
          </li>
        } @empty {
          <li class="ss__empty">لا توجد نتائج مطابقة</li>
          @if (allowCreate()) {
            <li class="ss__create" (click)="requestCreate()">
              {{ createLabel() }}
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
